{{- if include "stashito.inlineCredentials" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stashito.fullname" . }}
  labels:
    {{- include "stashito.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.upstreams }}
  {{- if and (not .existingSecret) (or .username .password) }}
  {{- $alias := include "stashito.envAlias" .alias }}
  UPSTREAM_{{ $alias }}_USERNAME: {{ required (printf "upstreams[%s].username is required with a password" .alias) .username | quote }}
  UPSTREAM_{{ $alias }}_PASSWORD: {{ required (printf "upstreams[%s].password is required with a username" .alias) .password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
